# Foundry configuration.
#
# Solidity dependencies live under lib/ and are version pinned:
#   forge-std                1.16.2  (submodule, rev pinned in foundry.lock)
#   openzeppelin-contracts   v5.7.0  (vendored, tag pinned)

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.25"
# Cancun for transient storage, which `ReentrancyGuardTransient` uses. Monad executes it.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Exactly these, never detected: OpenZeppelin's own submodules would otherwise add remappings,
# change the metadata hash, and stop a fresh recursive clone matching the verified contracts.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
# The scripts write nothing and read only the deployment record.
fs_permissions = [{ access = "read", path = "./packages/shared/src/deployments.json" }]

[profile.default.fuzz]
runs = 1000

# Reverts must not fail a run: most generated action sequences legitimately revert
# (NotDue above all), and failing on revert collapses every sequence to length 1.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"

# Monad's explorers verify through Sourcify; `forge verify-contract --verifier sourcify`
# needs no key.

[lint]
# Time is the product: schedules, streams and expiry are all comparisons against the block
# clock, and a validator's few seconds of timestamp latitude move at most a few seconds of accrual.
exclude_lints = ["block-timestamp"]
# Tests and scripts are instruments, not deployed code. Foundry 1.8 matches these only when the
# glob ends in a file pattern: "test/**" is silently ignored.
ignore = ["test/**/*.sol", "script/**/*.sol"]
