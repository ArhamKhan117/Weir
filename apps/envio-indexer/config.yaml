# Generated by scripts/sync.ts from packages/shared/src/deployments.json and
# packages/shared/src/abi.ts. Do not edit: update the deployment record, then run `pnpm sync`.
# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: weir
description: Weir mandates, charges, CRE reports and merchant revenue on Monad
# Every address the indexer stores or keys an entity by is lowercase, so a GraphQL filter needs
# no case folding.
address_format: lowercase
# Blocks carry their number, time and hash already; charges also need who sent them and to
# what, which is how a keeper batch is told from a direct call.
field_selection:
  transaction_fields:
    - hash
    - from
    - to
contracts:
  - name: MandateHub
    abi_file_path: ./abis/MandateHub.json
    events:
      - event: MandateCreated
      - event: Charged
      - event: ChargedFromBalance
      - event: ChargeFailed
      - event: MandateCancelled
      - event: MandatePaused
      - event: MandateResumed
      - event: ManagerChanged
      - event: NonceInvalidated
  - name: MandateCharger
    abi_file_path: ./abis/MandateCharger.json
    events:
      - event: ReportCharged
      - event: ChargeReverted
chains:
  - id: 143 # Monad
    start_block: 110186397
    hypersync_config:
      url: https://monad.hypersync.xyz
    # Takes over only when HyperSync has shown no new block for 20 seconds. The public RPC
    # answers at most 100 blocks per eth_getLogs.
    rpc:
      - url: ${ENVIO_RPC_URL_143:-https://rpc.monad.xyz}
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: MandateHub
        address: "0x184c6c26c1cb7f79885ed7c71e810e564ceec6a0"
      - name: MandateCharger
        address: "0xc555dbb7059b46fa4d3de4b6602e3c52caccff03"
  - id: 10143 # Monad Testnet
    start_block: 67841535
    hypersync_config:
      url: https://monad-testnet.hypersync.xyz
    # Takes over only when HyperSync has shown no new block for 20 seconds. The public RPC
    # answers at most 100 blocks per eth_getLogs.
    rpc:
      - url: ${ENVIO_RPC_URL_10143:-https://testnet-rpc.monad.xyz}
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: MandateHub
        address: "0x08ca57f960d5d9a2b06475c6ca4583eda4680bc1"
      - name: MandateCharger
        address: "0xb4333c519c9d5c300737824ca5792891dbba9e03"
